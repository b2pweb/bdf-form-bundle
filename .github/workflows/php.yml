name: CI

on:
  push:
    branches: [ '[1-9].[0-9]+' ]

  pull_request:
    branches: [ '[1-9].[0-9]+' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@v2
    
    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"
    
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: json
        ini-values: date.timezone=Europe/Paris
    - name: Check PHP Version
      run: php -v

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer run-script tests

  with_attributes:
    name: With bdf form attributes
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.0
        extensions: json
        ini-values: date.timezone=Europe/Paris

    - name: Install b2pweb/bdf-form-attribute
      run: composer require b2pweb/bdf-form-attribute

    - name: Run test suite
      run: composer run-script tests

  bdf_form_compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form-versions:
          - package: '1.0'
            php: '8.0'
          - package: '1.1'
            php: '8.0'
          - package: '1.2'
            php: '8.0'
          - package: '1.3'
            php: '8.0'
          - package: '1.4'
            php: '8.0'
          - package: '1.6'
            php: '8.0'
          - package: '1.7'
            php: '8.4'
          - package: '2.0'
            php: '8.4'
    name: Compatibility with b2pweb/bdf-form ${{ matrix.form-versions.package }}

    steps:
      - uses: actions/checkout@v2

      - name: Set Timezone
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Europe/Paris"

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.form-versions.php }}
          extensions: json
          ini-values: date.timezone=Europe/Paris

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install bdf form
        run: composer req --dev 'b2pweb/bdf-form:~${{ matrix.form-versions.package }}.0' --prefer-dist --no-progress

      - name: Run test suite
        run: composer run-script tests
